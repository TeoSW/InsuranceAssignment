# figures.toml: the workbook figures section E needs.
# A figure is found by its row label, in a sheet found by its name. There are no cell addresses:
# the column comes from the header ("an curent") and the unit from the sheet header ("Valori în ...").
#
# Fields of each [[figure]]:
#   id                      name used in relations, decisions and templates
#   sheets                  accepted sheet names (compared ignoring case, spaces and ş/ș)
#   labels                  accepted row labels (compared the same way); the value is used as stored
#   labels_stored_negative  optional: labels under which the workbook stores the value with a minus sign;
#                           the value is multiplied by -1
#   kind                    amount (lei, uses the sheet unit) | percent (stored as a fraction) | count

