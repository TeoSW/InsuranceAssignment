# gap_reasons.toml: the only reasons a gap may give, in Romanian.
# The program fills the {names} in braces; the text around them is yours to change.
# Every name the program uses must be here, or the run stops before writing a draft.

file_missing = "fișierul {file} nu există în folderul din care rulează programul"
file_unreadable = "fișierul {file} nu poate fi citit ({error})"
unexpected_error = "eroare neprevăzută la {what} ({error})"

# Reading a workbook
sheet_not_found = "foaia pentru „{label}” nu a fost găsită printre foile vizibile din {file} (nume căutate: {sheets})"
header_not_found = "coloana „{header}” nu apare exact o dată în foaia {sheet} din {file}"
label_not_found = "rândul „{label}” nu a fost găsit în foaia {sheet} din {file}"
label_not_unique = "„{label}” se potrivește cu {count} rânduri din foaia {sheet} din {file}"
unit_unknown = "unitatea de măsură a foii {sheet} din {file} lipsește sau nu este cunoscută: „{unit}”"
formula_no_value = "celula cu formula pentru „{label}” nu are valoare salvată și nu a putut fi recalculată ({file}, foaia {sheet})"
value_text = "în locul valorii pentru „{label}” este scris „{text}” ({file}, foaia {sheet})"
value_missing = "valoarea pentru „{label}” lipsește în {file}, foaia {sheet}"
value_missing_note = "valoarea pentru „{label}” lipsește în {file}, foaia {sheet}; nota din rând: „{note}”"

# Facts from documents
fact_unconfirmed = "afirmația „{statement}” nu a fost confirmată de un om (config/facts.toml)"
fact_not_found = "citatul pentru „{statement}” nu a fost găsit în {document}, pagina {page}"

# Checks and decisions ({values}: each value with its source, filled when the draft is written)
conflict = "pentru „{label}” sursele sau verificările nu se potrivesc ({values}); este nevoie de o decizie în config/decisions.toml"
