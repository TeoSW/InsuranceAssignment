# facts.toml: statements from the client's documents that the text may rely on.
# On every run the program looks for the quote on the given page of the document.
# A fact counts only if a person confirmed it AND the quote is found.
# Every fact below was DRAFTED by the program's authors and is NOT confirmed: confirmed_by is empty.
#
# Fields of each [[fact]]:
#   id            name used in templates
#   statement     what the fact supports, in plain words
#   document      file name; must be listed in settings.toml [documents].
#                 "" = no document: only the person who confirms it supports it
#   page          page of the document; documents without pages (.txt, .docx) use 1
#   quote         exact text from the document ("" only when document is "")
#   confirmed_by  who checked the quote against the document ("" = not confirmed)
#   confirmed_on  date of that check, "YYYY-MM-DD" ("" = not confirmed)
# Optional fields:
#   about         a figure whose change this fact explains
#   direction     "creștere" or "scădere": must match the calculated direction of `about`
#   explains      a figure; when that figure is a gap, this statement is added to its reason
#   figure        this fact supplies a figure with this id ...
#   value         ... whose value is this number, written exactly as in the quote ...
#   unit          ... in this unit (from settings.toml [units])

[[fact]]
