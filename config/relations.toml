# relations.toml: checks between figures, run before any figure reaches the text.
# Each relation names figures by their id (figures.toml, or a fact's figure in facts.toml).
#
#   type = "sum"    total = parts - minus, exactly. If it fails, every figure in it becomes a conflict.
#                   If total is a formula cell with no saved value, it is computed from the parts.
#   type = "equal"  a = b, exactly. If it fails, both become conflicts.
#   type = "less"   a < b. If it fails, a becomes a conflict.
#   type = "ratio"  r = a / b, within 0,05 of the displayed percentage. If it fails, r becomes a conflict.
#   type = "positive"  a > 0. If it fails, a becomes a conflict (a capital requirement of zero is a placeholder).
#
# If a figure of a relation is missing, the relation cannot be checked, and the figures a failure
# would turn into conflicts become gaps instead. The same happens if a figure the relation checks
# against is already in conflict: a relation never confirms figures against a disputed one.
# Relations run in this order, so a total computed by one sum can be checked by the next relation.

[[relation]]
type = "positive"
a = "scr"

[[relation]]
type = "positive"
a = "mcr"

[[relation]]
type = "sum"
total = "own_funds_total"
parts = ["own_funds_t1", "own_funds_t2", "own_funds_t3"]

[[relation]]
type = "sum"
total = "scr_basic"
parts = ["scr_underwriting", "scr_market", "scr_counterparty"]
minus = ["scr_diversification"]

[[relation]]
type = "sum"
total = "scr_in_modules"
parts = ["scr_basic", "scr_operational"]

[[relation]]
type = "equal"
a = "scr"
b = "scr_in_modules"

[[relation]]
type = "ratio"
r = "solvency_ratio"
a = "own_funds_total"
b = "scr"

[[relation]]
type = "less"
a = "mcr"
b = "scr"

[[relation]]
type = "equal"
a = "dividends_paid"
b = "dividends_approved"
